<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .bg { 
        fill: #ffffff; 
      }
      .brand-title {
        font-family: 'Cinzel', 'Times New Roman', serif;
        font-size: 80px;
        font-weight: 700;
        letter-spacing: 12px;
        fill: #1A303A; /* Premium Koyu Petrol / Lacivert */
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Helvetica Neue', sans-serif;
        font-size: 55px;
        font-weight: 800;
        letter-spacing: 18px;
        fill: #B68D40; /* Mat Altın / Bronz Detay */
      }
      .tagline {
        font-family: 'Montserrat', 'Helvetica', sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 6px;
        fill: #555555; /* Yumuşak Antrasit */
      }
      .line {
        stroke: #B68D40;
        stroke-width: 2;
      }
    </style>
  </defs>
  
  <rect class="bg" width="100%" height="100%" />

  <g transform="translate(400, 160)" text-anchor="middle">
    <text class="brand-title" y="0">OSMANLI</text>
    
    <text class="brand-subtitle" y="75">TESİSAT</text>
    
    <line class="line" x1="-150" y1="120" x2="150" y2="120" />
    
    <text class="tagline" y="150">PROFESYONEL SIHHİ TESİSAT</text>
  </g>
</svg>